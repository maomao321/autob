[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-stocks-autoquant"
version = "0.5.0"
description = "Binance Stocks quantitative trading backend and remote Qt frontend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
desktop = [
    "openpyxl>=3.1,<4",
    "PySide6>=6.7,<7",
]

[project.scripts]
autoquant = "autoquant_frontend.app:main"
autoquant-server = "autoquant_backend.server:main"

[tool.setuptools.packages.find]
where = ["frontend", "backend", "shared"]
include = ["autoquant_frontend*", "autoquant_backend*", "autoquant_shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
