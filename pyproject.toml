[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-stocks-autoquant"
version = "0.4.0"
description = "Binance Stocks desktop quantitative trading controller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1,<4",
    "PySide6>=6.7,<7",
    "websocket-client>=1.8,<2",
]

[project.scripts]
autoquant = "autoquant.app:main"

[tool.setuptools.packages.find]
include = ["autoquant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
